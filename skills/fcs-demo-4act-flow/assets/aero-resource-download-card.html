<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AI for Science · 气动资源获取</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, "PingFang SC", "Microsoft YaHei", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; color: #eef7ff; background: radial-gradient(circle at 18% 12%, #17365d 0, #07111f 45%, #030810 100%); }
    main { width: min(860px, calc(100vw - 48px)); padding: 38px; border: 1px solid #24476e; border-radius: 22px; background: rgba(7, 20, 36, .92); box-shadow: 0 30px 80px #0009; }
    .eyebrow { color: #70c7ff; font-size: 14px; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 10px 0 8px; font-size: 32px; }
    .sub { margin: 0 0 28px; color: #a9bdd0; }
    .source { display: flex; justify-content: space-between; gap: 16px; padding: 16px 18px; border-radius: 14px; background: #0d2238; }
    .source strong { color: #fff; }
    .badge { align-self: center; padding: 6px 10px; border-radius: 999px; color: #7be6b1; background: #0d3b2a; font-size: 13px; }
    .bar { height: 12px; margin: 26px 0 10px; overflow: hidden; border-radius: 999px; background: #13283d; }
    .bar span { display: block; width: 100%; height: 100%; background: linear-gradient(90deg, #35a7ff, #54e0bd); }
    .progress { display: flex; justify-content: space-between; color: #8fa8bc; font-size: 13px; }
    ul { margin: 26px 0 0; padding: 0; list-style: none; }
    li { display: grid; grid-template-columns: 26px 1fr auto; gap: 12px; align-items: center; padding: 15px 4px; border-bottom: 1px solid #17314b; }
    li:last-child { border-bottom: 0; }
    .check { color: #61e1a5; font-weight: 800; }
    .kind { color: #87a2b8; font-size: 13px; }
    footer { margin-top: 24px; padding-top: 18px; border-top: 1px solid #24415c; color: #9bb0c3; font-size: 13px; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">AI for Science · External Resource</div>
    <h1>气动与流场资源获取完成</h1>
    <p class="sub">已从科学智算任务中提取可用于气动物理补全的参考资源。</p>
    <div class="source">
      <div><strong>CNAI4S 科学智算共性平台</strong><br><span class="kind">eHDNN 方法求解抖振流场 · 流体力学</span></div>
      <span class="badge">连接正常</span>
    </div>
    <div class="bar"><span></span></div>
    <div class="progress"><span>资源获取</span><strong>100%</strong></div>
    <ul>
      <li><span class="check">✓</span><span>翼型非定常流场建模说明</span><span class="kind">技术资料</span></li>
      <li><span class="check">✓</span><span>流场重构与预测示例</span><span class="kind">Notebook 参考</span></li>
      <li><span class="check">✓</span><span>边界条件与物理约束摘要</span><span class="kind">模型输入</span></li>
    </ul>
    <footer>资源已加入当前任务上下文，可用于气动物理模块更新。</footer>
  </main>
</body>
</html>
